['窗外的风景，你更喜欢？','灯火和高楼，都市感很安心','街道间有几棵树就很好','公园、河流，随时能够散步','山海湖泊，最好能融入日常'],
['空出一天，你想去哪里？','商场、咖啡馆或室内场所','城里一处漂亮的街区','郊外的绿地或湖边','山野、海边，离城市远一些'],
['选择住处时，你对自然环境的期待？','便利最重要，景色排后面','附近有小绿地就够了','最好能走到公园或河边','宁愿绕点路，也想靠近山水'],
['你喜欢怎样的街区？','安静有边界，彼此不打扰','便利整洁，保持礼貌距离','有熟悉的小店和热情的老板','街坊常聊天，楼下就有热闹夜市'],
['关于吃饭，你更接近？','简单解决，省时省心','固定几家合口味的店','愿意为一口好吃的绕路','菜市场、小馆子都是生活主角'],
['邻居主动和你聊天，你会？','礼貌回应，然后回到自己的空间','简短聊聊，慢慢熟悉','挺开心，下次会主动打招呼','很快熟络，顺便交流生活情报'],

['面对陌生的生活方式，你通常？','熟悉自己的那一套就很好','先观察，挑一点适合自己的','感兴趣，愿意主动融入','越多元越好，想多体验几种'],
['度假结束时，你最舍不得？','高效打卡的充实感','暂时不用工作的轻松','不必看时间的自由','没有任何任务的松弛日常'],
['城市举办一场地方文化活动，你会？','大概率不参加','朋友邀请就一起看看','主动了解并安排时间','还想弄懂它背后的故事'],
['理想的散步路线是？','繁华街道，灯光明亮','安静整齐的住宅街区','沿着河岸，穿过公园','能听见风和水，远处还有山'],
['让你对一座城有归属感的瞬间是？','拥有独立而安稳的空间','熟悉了常走的几条路','店主记住了我的口味','有人招呼我坐下，一起吃顿饭']
];

['上海','把理想，过成具体的日常。','多元 / 都市 / 独立',[3,3,1,3,1,1],'你愿意接触新事物，也享受有边界的相处。城市的密度与多元体验，能装下你不止一种生活身份。','逛一场展览，再沿街散步，给忙碌的一天留一点自己的空间。','丰富的选择也可能带来疲惫，记得为自己保留休息日。'],

['杭州','向前生长，也向湖边歇一歇。','山水 / 灵感 / 平衡',[2,3,2,2,3,1],'你既想探索机会，又不愿把生活的柔软全部让出去。山水与都市相邻的想象，呼应你对平衡的期待。','完成今天最重要的事，再留一段沿湖散步的时间。','理想的平衡需要主动安排，别只把休息留在计划里。'],
['成都','日子不必赶，快乐有回甘。','松弛 / 烟火 / 相聚',[1,1,3,2,1,3],'你很珍惜生活的余裕，也从熟悉的人情和日常滋味里获得能量。慢慢聊、好好吃的城市印象，与你很合拍。','找个茶馆坐一会儿，晚饭约上聊得来的朋友。','舒服很珍贵，也可以给自己设一个小小的新目标。'],
['重庆','生活要热烈，也要有滋味。','热烈 / 层次 / 烟火',[2,2,1,1,2,3],'你容易被热闹和鲜活的生活感染，也愿意拥抱一点不按常规的体验。层层叠叠的街道与浓烈烟火，是你的城市剧本。','白天随坡道闲逛，晚上找个能看灯火的地方吃饭。','生活不必每天高能量，累的时候也允许自己安静下来。'],
['苏州','把寻常日子，过成细水长流。','雅致 / 从容 / 园林',[1,1,3,3,2,1],'你不急着向世界证明什么，更愿意欣赏细节、经营自己的节奏。园林与水巷的文化想象，能安放你的内在秩序。','挑一个不赶时间的下午，逛园子、看窗影、喝杯茶。','沉静之外，也值得偶尔主动结识新的朋友。'],
['南京','故事很厚，日子很真。','历史 / 亲切 / 沉稳',[2,1,2,3,2,2],'你既想要能反复回味的文化，也需要踏实、亲近的日常。历史与街巷并行的城市气质，与你的生活期待相近。','从一处旧建筑走到一条小吃街，慢慢感受城市的层次。','喜欢的历史氛围只是生活的一面，也看看实际的日常便利。'],
['西安','一半长安梦，一半人间味。','古意 / 热闹 / 故事',[1,1,2,3,1,3],'你喜欢有故事可听，也有热乎饭可吃的地方。厚重文化与直接烟火并存的城市想象，贴近你的偏好。','逛一处文化空间，再用一碗面结束今天的散步。','别把全部期待交给古城滤镜，普通的一天同样值得体验。'],
['厦门','让生活，留一点海风的位置。','海风 / 文艺 / 轻盈',[1,1,3,2,3,1],'你想保留感受生活的能力，喜欢自然与审美悄悄融入日常。海风、街道和轻一点的节奏，符合你的心情。','挑个好天气沿海走走，把手机放进口袋十分钟。','旅行里的轻松也需要日常经营，给现实安排留一点位置。'],
['青岛','吹吹海风，再慢慢向前。','海岸 / 坦然 / 舒展',[1,1,2,2,3,2],'你喜欢开阔自然，也不排斥有烟火气的相处。海岸与街区相接的城市印象，能让你觉得舒展而踏实。','从一条老街走到海边，找一处喜欢的位置看天色变化。','享受开阔的同时，也照顾好自己对便利与社交的具体需要。'],
['大理','把时间，还给风与自己。','自然 / 自由 / 留白',[0,1,3,2,3,1],'你的答案里有明显的留白感：希望亲近自然，也希望自己掌握生活的节奏。山与湖的城市意象，会让你心动。','安排一次不打卡的散步，听风，观察天色。','把想要的松弛拆成可以实践的小事，理想生活才更容易落地。'],
['昆明','不慌不忙，也能向阳生长。','舒展 / 日常 / 亲近',[0,1,3,1,3,3],'你重视自然、生活余裕和身边人的温度。舒展而亲近的城市想象，与你想把普通日子过好的心愿很合拍。','逛逛花市或菜市场，带一束花和一份晚饭回家。','慢一点并不妨碍前进，给喜欢的事情保留持续投入。'],
['长沙','热闹是底色，快乐要当下。','鲜活 / 相聚 / 表达',[2,2,1,2,1,3],'你喜欢鲜活的体验，也愿意在相聚中获得情绪能量。热闹街巷与活跃表达的城市印象，能接住你的兴致。','约朋友散步吃饭，给平凡的一晚安排一点新鲜感。','开心之外，记得为睡眠与独处也留好位置。'],
['武汉','有奔头，也有热气腾腾的日常。','爽快 / 活力 / 江湖',[2,2,1,2,2,3],'你希望日子有向前的劲头，也喜欢直接、实在的人情味。江水与街巷的城市想象，呼应你的活力和踏实。','早起好好吃顿早餐，傍晚去江边让脚步慢下来。','前进的时候也记得停一停，别把疲惫当作理所当然。']

function home(){screen(`<section class="hero"><div><div class="tag">一场关于生活方式的小旅行</div><h1>世界那么大，<br><em>哪座城更像你？</em></h1><p class="lead">有些城市让你心动，有些城市让你自在。<br>从日常的小选择里，找到与你同频的人生下一站。</p><div class="meta"><span>24 道情境题</span><span>${C.length} 座城市灵感</span><span>约 4 分钟</span></div><fieldset class="scope"><legend>这次，你想探索哪里？</legend><div class="scope-options">${Object.entries(SCOPES).map(([key,label])=>`<label><input type="radio" name="scope" value="${key}" ${scope===key?'checked':''}><span>${label}<small>${cityPool(key).length} 座城市</small></span></label>`).join('')}</div></fieldset><button class="primary" id="start">领取我的城市车票</button></div><div class="art" aria-hidden="true"><svg viewBox="0 0 460 440"><rect width="460" height="440" fill="#dfe6ff"/><circle cx="350" cy="95" r="48" fill="#ffad7e"/><path d="M0 255Q100 130 220 235T460 190V440H0" fill="#a3b9e4"/><path d="M0 320Q170 180 330 285T460 250V440H0" fill="#6e91b9"/><path d="M0 355Q130 325 220 350T460 320V440H0" fill="#486e91"/><g fill="#f5f6ff"><path d="M40 270V150H85V270ZM95 270V190H130V270ZM140 270V120H190V270ZM205 270V170H235V270ZM250 270V205H290V270Z"/><path d="M315 270V150H325V105H330V150H340V270Z"/></g><path d="M10 290H450" stroke="#dfe6ff" stroke-width="3"/><path d="M120 440Q260 320 460 365" stroke="#bed8e6" stroke-width="35" fill="none"/></svg><div class="ticket"><span>出发地：现在的自己</span><b>目的地：更自在的生活</b><span>不限出发时间 · 凭直觉入座</span></div></div></section><section class="features"><div><b>不问标准答案</b><p>从周末安排到街角小店，选择更接近平时的你。</p></div><div><b>看见生活偏好</b><p>六个维度，读懂你对一座城市的期待。</p></div><div><b>带走城市名片</b><p>发现你的前三名，保存专属匹配卡。</p></div></section><p class="note">测试采用原创生活偏好题与城市文化印象画像，不代表真实城市排名。答案仅在本机处理。</p>`);app.querySelectorAll('input[name=scope]').forEach(input=>input.onchange=()=>{scope=input.value});document.getElementById('start').onclick=()=>{scope=app.querySelector('input[name=scope]:checked').value;answers.fill(null);current=0;quiz()}}
function quiz(){let q=Q[current],n=answers.filter(x=>x!==null).length;screen(`<section class="panel"><div class="row small"><span>${SCOPES[scope]} · 凭直觉选择</span><span>${current+1} / ${Q.length}</span></div><div class="progress" role="progressbar" aria-label="已作答题数" aria-valuemin="0" aria-valuemax="24" aria-valuenow="${n}"><i style="width:${n/24*100}%"></i></div><h2 id="question">${q.title}</h2><div class="options" role="radiogroup" aria-labelledby="question">${q.options.map((t,i)=>`<button class="option" role="radio" aria-checked="${answers[current]===i}" tabindex="${answers[current]===i||(answers[current]===null&&i===0)?0:-1}" data-choice="${i}"><span>${'ABCD'[i]}</span><span>${t}</span></button>`).join('')}</div><div class="nav"><button class="secondary" id="back" ${current===0?'disabled':''}>上一题</button><button class="primary" id="next" ${answers[current]===null?'disabled':''}>${current===23?'揭晓我的城市':'下一题'}</button></div><p class="note">选择后点击下一步，可以随时返回修改答案。</p></section>`);let opts=[...app.querySelectorAll('[data-choice]')];function select(i){answers[current]=i;opts.forEach((b,j)=>{b.setAttribute('aria-checked',i===j);b.tabIndex=i===j?0:-1});document.getElementById('next').disabled=false;let n=answers.filter(x=>x!==null).length;app.querySelector('.progress i').style.width=n/24*100+'%';app.querySelector('[role=progressbar]').setAttribute('aria-valuenow',n)}opts.forEach((b,i)=>{b.onclick=()=>select(i);b.onkeydown=e=>{let k;if(e.key==='ArrowDown'||e.key==='ArrowRight')k=(i+1)%4;if(e.key==='ArrowUp'||e.key==='ArrowLeft')k=(i+3)%4;if(e.key==='Home')k=0;if(e.key==='End')k=3;if(k!==undefined){e.preventDefault();select(k);opts[k].focus()}}});document.getElementById('back').onclick=()=>{current--;quiz()};document.getElementById('next').onclick=()=>{if(answers[current]===null)return;if(current<23){current++;quiz()}else result()}}
function score(a,s=scope){if(a.length!==24||a.some(x=>!Number.isInteger(x)||x<0||x>3))throw Error('请先完成所有题目');const v=Array(6).fill(0),counts=Array(6).fill(0);Q.forEach((q,i)=>{v[q.dim]+=a[i];counts[q.dim]++});v.forEach((_,i)=>v[i]/=counts[i]);return {v,scope:s,rank:cityPool(s).map((c,i)=>({c,i,d:c.v.reduce((s,x,j)=>s+(x-v[j])**2,0)})).sort((a,b)=>a.d-b.d||a.i-b.i)}}
function result(){let r=score(answers),c=r.rank[0].c;screen(`<section class="result"><article class="card"><div class="row"><span class="tag">你的专属城市名片</span><span class="small">${SCOPES[r.scope]} · ${cityPool(r.scope).length} 城匹配</span></div><h1 class="city">${c.name}</h1><p class="quote">${c.quote}</p><div class="chips">${c.tags.split(' / ').map(t=>`<span class="chip">${t}</span>`).join('')}</div><div class="details"><section><h3>为什么与你同频</h3><p>${c.reason}</p></section><section><h3>在这里，试着这样过一天</h3><p>${c.day}</p></section></div><div class="bars">${r.v.map((v,i)=>`<div><div class="row small"><span>${D[i]}</span><span>${Math.round(v/3*100)}</span></div><div class="bar"><i style="width:${v/3*100}%"></i></div></div>`).join('')}</div><div class="suggest"><b>给你的生活小提醒</b><p>${c.tip}</p></div><h3>另外两座，也值得心动</h3><div class="alternatives">${r.rank.slice(1,3).map((x,i)=>`<div class="alternative"><span class="small">备选 ${i+1}</span><br><b>${x.c.name}</b><p class="small">${x.c.quote}</p></div>`).join('')}</div><p class="note">分数表示本次回答中的偏好强度，无高低优劣；城市在所选范围内按六维画像距离排序，同分按固定顺序展示。结果基于文化印象，不包含实时房价、就业、气候或签证数据。</p></article><div class="actions"><button class="primary" id="save">保存城市名片</button><button class="secondary" id="edit">修改答案</button><button class="secondary" id="restart">重新测试</button></div><p class="status" role="status" id="status"></p></section>`);document.getElementById('save').onclick=()=>poster(r);document.getElementById('edit').onclick=()=>{current=23;quiz()};document.getElementById('restart').onclick=home}
function poster(r){try{const c=r.rank[0].c,canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1520;let x=canvas.getContext('2d');x.fillStyle='#eef1ff';x.fillRect(0,0,1080,1520);x.fillStyle='#fff';x.fillRect(45,45,990,1430);function text(t,y,size=32,color='#283558'){x.font=`${size}px "Microsoft YaHei",sans-serif`;x.fillStyle=color;x.fillText(t,95,y)}function wrap(t,y,size=31){x.font=`${size}px "Microsoft YaHei",sans-serif`;let line='';for(let char of t){if(x.measureText(line+char).width>880){text(line,y,size);y+=size*1.7;line=char}else line+=char}text(line,y,size);return y+size*1.7}text('人生下一站 / 我的城市名片 · '+SCOPES[r.scope],125,28,'#6576bf');text(c.name,290,120,'#3048ce');text(c.tags,360,29,'#6b78aa');let y=wrap(c.quote,450,40);y=wrap(c.reason,y+30);text('我的生活偏好',y+35,33);let top=y+90;r.v.forEach((v,i)=>{let left=95+(i%2)*465,t=top+Math.floor(i/2)*90;x.fillStyle='#57658e';x.font='27px "Microsoft YaHei",sans-serif';x.fillText(D[i]+'  '+Math.round(v/3*100),left,t);x.fillStyle='#e9edf9';x.fillRect(left,t+17,400,8);x.fillStyle='#697cde';x.fillRect(left,t+17,400*v/3,8)});y=top+300;text('也许也会爱上',y,30);text(r.rank.slice(1,3).map(x=>x.c.name).join('  ·  '),y+65,45,'#3048ce');wrap(c.day,y+140,29);text('测测你适合哪座城市 · 24 道题，发现同频生活',1385,25,'#7180a7');text('趣味测试，仅供娱乐；不代表真实城市评价。',1435,24,'#7180a7');canvas.toBlob(blob=>{if(!blob){document.getElementById('status').textContent='图片生成失败，请截图保存。';return}let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='我的城市名片-'+c.name+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);document.getElementById('status').textContent='名片已生成；如手机未下载，请使用浏览器打开或截图保存。'},'image/png')}catch(e){document.getElementById('status').textContent='当前环境无法保存图片，请截图保存。'}}
home();
</script></body></html>
